<rect class="box" x="180" y="156" width="170" height="48" rx="8"/><text class="t" x="265" y="184" text-anchor="middle">i18n.setLocale()</text>
<rect class="box" x="400" y="56" width="200" height="48" rx="8"/><text class="t" x="500" y="84" text-anchor="middle">ApiLocalePreference</text>
<rect class="box" x="660" y="20" width="280" height="48" rx="8"/><text class="t" x="800" y="40" text-anchor="middle">localStorage['locale']</text><text class="s" x="800" y="57" text-anchor="middle">đọc ngay khi mở trang</text>
<rect class="box" x="660" y="92" width="280" height="48" rx="8"/><text class="t" x="800" y="112" text-anchor="middle">PATCH /preferences</text><text class="s" x="800" y="129" text-anchor="middle">→ IndexedDB (sau này: server)</text>
<rect class="box" x="400" y="206" width="200" height="48" rx="8"/><text class="t" x="500" y="234" text-anchor="middle">useI18n()</text>
<rect class="box" x="660" y="206" width="280" height="48" rx="8"/><text class="t" x="800" y="226" text-anchor="middle">React vẽ lại</text><text class="s" x="800" y="243" text-anchor="middle">QuestionCard, CatalogPage, Roadmap</text>
<rect class="box" x="400" y="286" width="200" height="48" rx="8"/><text class="t" x="500" y="314" text-anchor="middle">ShellController</text>
<rect class="box" x="660" y="286" width="280" height="48" rx="8"/><text class="t" x="800" y="306" text-anchor="middle">DomTranslator.apply()</text><text class="s" x="800" y="323" text-anchor="middle">[data-i18n], &lt;title&gt;, &lt;html lang&gt;</text>
