<rect class="stepbg ok" x="676" y="480" width="288" height="52" rx="8" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.7594;0.7714;0.97;0.982;1"/></rect>
<circle class="num ok" cx="694" cy="498" r="10"/><text class="n" x="694" y="502" text-anchor="middle">9</text>
<text class="tc" x="712" y="502">useStore → vẽ lại</text><text class="s" x="712" y="520">QuestionCard hiện đúng/sai + giải thích</text>
<text class="s" x="16" y="544">Xanh dương: yêu cầu đi xuống · Xanh lá: kết quả đi lên. Mỗi tầng chỉ gọi tầng ngay dưới nó.</text>

