<circle class="tok" r="7" opacity="0">
  <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M225,60 L225,160 L400,160 L400,260 L400,310 L225,310 L225,360 L400,360 L575,360 L575,460 L400,460" keyPoints="0;0;1;1" keyTimes="0;0.03;0.44;1"/>
  <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.018;0.03;0.45;0.462;1"/>
</circle>
