</circle>
<rect class="pill" x="312" y="47" width="116" height="26" rx="13" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.848;0.86;0.97;0.982;1"/></rect>
<text class="pilltext" x="370" y="65" text-anchor="middle" opacity="0">✓ Chính xác<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.848;0.86;0.97;0.982;1"/></text>
<rect class="stepbg" x="676" y="16" width="288" height="52" rx="8" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.012;0.024;0.0622;0.0742;1"/></rect>
<circle class="num" cx="694" cy="34" r="10"/><text class="n" x="694" y="38" text-anchor="middle">1</text>
<text class="tc" x="712" y="38">dispatch({type:"exam/submit"})</text><text class="s" x="712" y="56">Bấm Kiểm tra: UI chỉ phát event</text>
<rect class="stepbg" x="676" y="74" width="288" height="52" rx="8" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.0502;0.0622;0.1506;0.1626;1"/></rect>
<circle class="num" cx="694" cy="92" r="10"/><text class="n" x="694" y="96" text-anchor="middle">2</text>
<text class="tc" x="712" y="96">ExamController.submit()</text><text class="s" x="712" y="114">Chấm đúng/sai bằng Scoring</text>
<rect class="stepbg" x="676" y="132" width="288" height="52" rx="8" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.1386;0.1506;0.239;0.251;1"/></rect>
<circle class="num" cx="694" cy="150" r="10"/><text class="n" x="694" y="154" text-anchor="middle">3</text>
<text class="tc" x="712" y="154">AttemptService.answer()</text><text class="s" x="712" y="172">Gọi api.put(...) như REST thường</text>
<rect class="stepbg" x="676" y="190" width="288" height="52" rx="8" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.227;0.239;0.2953;0.3073;1"/></rect>
<circle class="num" cx="694" cy="208" r="10"/><text class="n" x="694" y="212" text-anchor="middle">4</text>
<text class="tc" x="712" y="212">PUT /attempts/:id/answers/:q</text><text class="s" x="712" y="230">CompositeApiClient chọn LocalApiClient</text>
<rect class="stepbg" x="676" y="248" width="288" height="52" rx="8" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.2833;0.2953;0.3837;0.3957;1"/></rect>
<circle class="num" cx="694" cy="266" r="10"/><text class="n" x="694" y="270" text-anchor="middle">5</text>
<text class="tc" x="712" y="270">AttemptResource.answer()</text><text class="s" x="712" y="288">LocalApiClient khớp route</text>
<rect class="stepbg" x="676" y="306" width="288" height="52" rx="8" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.3717;0.3837;0.52;0.532;1"/></rect>
<circle class="num" cx="694" cy="324" r="10"/><text class="n" x="694" y="328" text-anchor="middle">6</text>
<text class="tc" x="712" y="328">StorageDriver.put()</text><text class="s" x="712" y="346">Ghi lượt làm bài vào IndexedDB</text>
