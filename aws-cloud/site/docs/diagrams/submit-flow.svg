  <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M400,460 L575,460 L575,360 L400,360 L225,360 L225,310 L400,310 L400,260 L400,160 L575,160 L575,110 L225,110 L225,60" keyPoints="0;0;1;1" keyTimes="0;0.5;0.86;1"/>
