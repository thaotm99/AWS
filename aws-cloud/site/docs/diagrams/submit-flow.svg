<rect class="box" x="150" y="36" width="150" height="48" rx="8"/><text class="t" x="225" y="56" text-anchor="middle">QuestionCard</text><text class="s" x="225" y="73" text-anchor="middle">nút Kiểm tra</text>
<rect class="box" x="150" y="136" width="150" height="48" rx="8"/><text class="t" x="225" y="164" text-anchor="middle">EventBus</text>
<rect class="box" x="325" y="136" width="150" height="48" rx="8"/><text class="t" x="400" y="164" text-anchor="middle">ExamController</text>
<rect class="box" x="500" y="136" width="150" height="48" rx="8"/><text class="t" x="575" y="164" text-anchor="middle">ExamStore</text>
<rect class="box" x="325" y="236" width="150" height="48" rx="8"/><text class="t" x="400" y="264" text-anchor="middle">AttemptService</text>
<rect class="box" x="145" y="336" width="160" height="48" rx="8"/><text class="t" x="225" y="356" text-anchor="middle">CompositeApiClient</text><text class="s" x="225" y="373" text-anchor="middle">chọn client</text>
<rect class="box" x="325" y="336" width="150" height="48" rx="8"/><text class="t" x="400" y="364" text-anchor="middle">LocalApiClient</text>
<rect class="box" x="500" y="336" width="150" height="48" rx="8"/><text class="t" x="575" y="364" text-anchor="middle">AttemptResource</text>
<rect class="box" x="500" y="436" width="150" height="48" rx="8"/><text class="t" x="575" y="464" text-anchor="middle">StorageDriver</text>
