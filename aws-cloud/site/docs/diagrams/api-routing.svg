<text class="tc" x="20" y="420" text-anchor="start" opacity="0">GET /certifications/saa-c03/exams/1 → StaticApiClient → file JSON<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.018;0.03;0.21;0.222;1"/></text>
<text class="tc" x="20" y="420" text-anchor="start" opacity="0">PUT /attempts/:id/answers/:q → LocalApiClient → AttemptResource → IndexedDB<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.208;0.22;0.43;0.442;1"/></text>
<text class="tc" x="20" y="420" text-anchor="start" opacity="0">PATCH /preferences {locale} → LocalApiClient → PreferenceResource → IndexedDB<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.428;0.44;0.63;0.642;1"/></text>
<text class="h" x="20" y="44">Hôm nay</text>
<text class="s" x="96" y="44">Nội dung đề đọc từ JSON tĩnh, dữ liệu người học trả lời ngay trong trình duyệt.</text>
