<text class="s" x="20" y="420" text-anchor="start" opacity="0">Chỉ đổi một chỗ: app/api.ts trả về HttpApiClient. Service, controller, UI giữ nguyên.<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.668;0.68;0.976;0.988;1"/></text>
<text class="h" x="20" y="44">Khi có server</text>
<text class="s" x="128" y="44">Thay ApiClient, các tầng trên không biết gì thay đổi.</text>
