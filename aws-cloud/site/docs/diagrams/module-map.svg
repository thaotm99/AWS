<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
<title id="title">Bản đồ module</title>
<desc id="desc">pages dùng app và modules; app đăng ký các module; modules và app dùng core.</desc>
<style>
.bg{fill:#f6f8f9}
.band{fill:#ebf1f3}
.panel{fill:#ffffff;stroke:#d8e1e5}
.box{fill:#ffffff;stroke:#c3d0d6;stroke-width:1.2}
.box.core{fill:#eef4f6}
.chip{fill:#eef4f6;stroke:#d0dce2}
.t{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#14212b}
.tc{font:500 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#14212b}
.s{font:12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#586973}
.h{font:600 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#14212b}
.lbl{font:700 10.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.08em;fill:#586973}
.n{font:700 11px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#ffffff}
.wire{fill:none;stroke:#9fb2bc;stroke-width:1.5}
.wire.back{stroke:#2b7a4b;stroke-dasharray:5 4;opacity:.7}
.flow{fill:none;stroke:#0a6a85;stroke-width:1.6;stroke-dasharray:6 5;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
.arrow{fill:#9fb2bc}
.arrow.a{fill:#0a6a85}
.tok{fill:#0a6a85;stroke:#ffffff;stroke-width:2}
.tok.ok{fill:#2b7a4b}
.tok.edge{fill:#b46c0c}
.hl{fill:none;stroke:#0a6a85;stroke-width:2.5}
.hl.ok{stroke:#2b7a4b}
.stepbg{fill:#dfeff3}
.stepbg.ok{fill:#e1f2e7}
.num{fill:#0a6a85}
.num.ok{fill:#2b7a4b}
.pill{fill:#e1f2e7;stroke:#2b7a4b}
.pilltext{font:700 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2b7a4b}
.db{fill:#f7ead6;stroke:#b46c0c}
@media (prefers-color-scheme: dark){
.bg{fill:#0e161b}.band{fill:#131e25}.panel{fill:#152129;stroke:#26353e}
.box{fill:#152129;stroke:#33454f}.box.core{fill:#14252e}.chip{fill:#1a2a33;stroke:#2c3d47}
.t,.tc,.h{fill:#e2eaee}.s,.lbl{fill:#91a3ad}
.wire{stroke:#4b5f69}.arrow{fill:#4b5f69}.flow{stroke:#52b6d1}.arrow.a{fill:#52b6d1}
.tok{fill:#52b6d1;stroke:#0e161b}.tok.ok{fill:#63c48f}.tok.edge{fill:#e3a14c}
.hl{stroke:#52b6d1}.hl.ok{stroke:#63c48f}.stepbg{fill:#143140}.stepbg.ok{fill:#173426}
.num{fill:#52b6d1}.num.ok{fill:#63c48f}.n{fill:#0e161b}
.pill{fill:#173426;stroke:#63c48f}.pilltext{fill:#63c48f}.db{fill:#3a2a14;stroke:#e3a14c}
.wire.back{stroke:#63c48f}
}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow a" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="960" height="500" rx="12"/>

<rect class="panel" x="20" y="20" width="920" height="64" rx="10"/>
<text class="lbl" x="36" y="42">SRC/PAGES · SRC/LAYOUTS (ASTRO)</text>
<text class="s" x="36" y="64">Trang tĩnh: /on-tap/…, /concepts/…, /api/*.json (sinh lúc build). Gắn các component React của module.</text>

<rect class="panel" x="20" y="134" width="250" height="172" rx="10"/>
<text class="lbl" x="36" y="158">SRC/APP · GHÉP NỐI</text>
<text class="tc" x="36" y="190">api.ts</text><text class="s" x="104" y="190">một ApiClient cho cả site</text>
<text class="tc" x="36" y="222">i18n.ts</text><text class="s" x="104" y="222">gom từ điển các module</text>
<text class="tc" x="36" y="254">theme.ts</text><text class="s" x="104" y="254">sáng / tối</text>
<text class="tc" x="36" y="286">T.astro</text><text class="s" x="104" y="286">chữ dịch được trong Astro</text>

<rect class="panel" x="310" y="134" width="630" height="172" rx="10"/>
<text class="lbl" x="326" y="158">SRC/MODULES · MỖI TÍNH NĂNG MỘT MODULE</text>
<rect class="box" x="326" y="170" width="224" height="124" rx="8"/><text class="t" x="338" y="186">shell</text>
<rect class="chip" x="338" y="192" width="96" height="24" rx="6"/><text class="tc" x="386" y="208" text-anchor="middle">domain/</text><rect class="chip" x="442" y="192" width="96" height="24" rx="6"/><text class="tc" x="490" y="208" text-anchor="middle">api/</text><rect class="chip" x="338" y="224" width="96" height="24" rx="6"/><text class="tc" x="386" y="240" text-anchor="middle">services/</text><rect class="chip" x="442" y="224" width="96" height="24" rx="6"/><text class="tc" x="490" y="240" text-anchor="middle">i18n/</text><rect class="chip" x="338" y="256" width="96" height="24" rx="6"/><text class="tc" x="386" y="272" text-anchor="middle">ui/</text>
<rect class="box" x="562" y="170" width="364" height="124" rx="8"/><text class="t" x="574" y="186">practice (Ôn tập)</text>
<rect class="chip" x="574" y="192" width="108" height="24" rx="6"/><text class="tc" x="628" y="208" text-anchor="middle">ui/</text><rect class="chip" x="690" y="192" width="108" height="24" rx="6"/><text class="tc" x="744" y="208" text-anchor="middle">app/</text><rect class="chip" x="806" y="192" width="108" height="24" rx="6"/><text class="tc" x="860" y="208" text-anchor="middle">services/</text><rect class="chip" x="574" y="224" width="108" height="24" rx="6"/><text class="tc" x="628" y="240" text-anchor="middle">api/</text><rect class="chip" x="690" y="224" width="108" height="24" rx="6"/><text class="tc" x="744" y="240" text-anchor="middle">domain/</text><rect class="chip" x="806" y="224" width="108" height="24" rx="6"/><text class="tc" x="860" y="240" text-anchor="middle">i18n/</text><rect class="chip" x="574" y="256" width="108" height="24" rx="6"/><text class="tc" x="628" y="272" text-anchor="middle">content/</text>

<rect class="panel" x="20" y="356" width="920" height="104" rx="10"/>
<text class="lbl" x="36" y="374">SRC/CORE · HẠ TẦNG DÙNG CHUNG, KHÔNG BIẾT TÍNH NĂNG NÀO</text>
<rect class="box" x="27" y="381" width="172" height="54" rx="8"/><text class="t" x="113" y="404" text-anchor="middle">api/</text><text class="s" x="113" y="421" text-anchor="middle">ApiClient · StorageDriver</text><rect class="box" x="211" y="381" width="172" height="54" rx="8"/><text class="t" x="297" y="404" text-anchor="middle">state/</text><text class="s" x="297" y="421" text-anchor="middle">Store · Controller</text><rect class="box" x="395" y="381" width="172" height="54" rx="8"/><text class="t" x="481" y="404" text-anchor="middle">i18n/</text><text class="s" x="481" y="421" text-anchor="middle">I18n · Translator</text><rect class="box" x="579" y="381" width="172" height="54" rx="8"/><text class="t" x="665" y="404" text-anchor="middle">preferences/</text><text class="s" x="665" y="421" text-anchor="middle">Preference · Choice</text><rect class="box" x="763" y="381" width="172" height="54" rx="8"/><text class="t" x="849" y="404" text-anchor="middle">theme/</text><text class="s" x="849" y="421" text-anchor="middle">ThemeManager</text>

<path class="flow" d="M145,84 L145,130" marker-end="url(#arrA)"/>
<path class="flow" d="M625,84 L625,130" marker-end="url(#arrA)"/>
<path class="flow" d="M270,206 L306,206" marker-end="url(#arrA)"/>
<text class="s" x="288" y="198" text-anchor="middle">đăng ký</text>
<path class="flow" d="M310,270 L274,270" marker-end="url(#arrA)"/>
<text class="s" x="292" y="290" text-anchor="middle">dùng</text>
<path class="flow" d="M145,306 L145,352" marker-end="url(#arrA)"/>
<path class="flow" d="M625,306 L625,352" marker-end="url(#arrA)"/>
<text class="s" x="20" y="486">Mũi tên chạy = chiều import (A → B: A phụ thuộc vào B). core không import ai; module mới chỉ cần đăng ký ở app/.</text>

</svg>
