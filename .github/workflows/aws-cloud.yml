name: aws-cloud

on:
  push:
    branches: [master]
    paths:
      - "aws-cloud/**"
      - "solution-architect-aws/**/*.md"
      - "solution-architect-aws/*.html"
      - "solution-architect-aws/translations/**"
      - ".github/workflows/aws-cloud.yml"
  pull_request:
    paths:
      - "aws-cloud/**"
      - "solution-architect-aws/**/*.md"
      - "solution-architect-aws/*.html"
      - "solution-architect-aws/translations/**"
      - ".github/workflows/aws-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-cloud-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to master runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The site is deployed by Vercel (aws-cloud/site/vercel.json + middleware.ts Basic Auth).
# The former S3 + CloudFront deploy job was removed: it published the copyrighted practice-test
# content with no auth and without the vercel.json redirects. aws-cloud/infra stays as reference
# and is only synthesized here, never deployed.
jobs:
  site:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-cloud/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aws-cloud/site/package-lock.json
      - name: Validate Vietnamese translations of practice tests 1-6
        working-directory: solution-architect-aws/translations
        run: node tools/validate.mjs 1 2 3 4 5 6
      - run: npm ci
      # No artifact upload: dist/ holds the copyrighted practice tests, and nothing deploys from CI any more.
      - run: npm run build

  infra:
    name: Check infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-cloud/infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aws-cloud/infra/package-lock.json
      - run: npm ci
      - run: npm run build
      # Synth without credentials: proves the stack renders; deploying infra stays a manual `cdk deploy`.
      - run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
